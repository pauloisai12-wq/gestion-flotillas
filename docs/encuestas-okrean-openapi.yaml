# OpenAPI 3.1 — Encuestas Okrean, cara de DISPOSITIVO (ingesta por API key).
#
# Este archivo es ESTÁTICO y se mantiene a mano. El generador runtime
# (`/api/docs`, `docsRouter`) está apagado en producción por decisión explícita
# —`api/src/index.ts:232-236` solo lo monta si `NODE_ENV !== 'production'`, para
# no publicar el mapa completo de endpoints en internet—, así que el contrato que
# consume el equipo móvil no puede depender de él.
#
# Alcance: la cara de dispositivo — la ingesta `/api/v1/encuestas` y la subida de
# audios `/api/v1/encuestas/{idLocal}/audios`. La cara del revisor (`/api/encuestas`,
# `/api/encuestas/export.csv`, JWT + rol REVISOR_QA) vive en `docs/encuestas-okrean.md`
# y no se publica aquí: es interna del portal, no del contrato con la app.
#
# La fuente de verdad del schema es `api/src/validators/encuestasIngestValidator.ts`.
# Si los dos divergen, gana el validador y ESTE archivo está desactualizado.

openapi: 3.1.0

info:
  title: Encuestas Okrean — API de ingesta (v1, v3 y v4)
  version: '4.1.0'
  summary: Recepción de encuestas de campo desde la app móvil Encuestas Okrean.
  description: |
    Contrato entre la app móvil **Encuestas Okrean** y el backend de flotillas.

    **Se aceptan TRES versiones del cuestionario:** `versionCuestionario: 1` (el
    restaurado, con sus dos ramas por `estado`), `versionCuestionario: 3` (el
    vigente) y `versionCuestionario: 4` (v3 con **catálogo propio en P8**
    —sale `paola_barrera`; entran `paco_nino` y `goyo_castaneda`— más las
    opciones `otro` / `no_sabe_no_contesta` y sus preguntas abiertas; P9 sí
    extiende el catálogo de v3). El servidor despacha por ese entero **antes** de validar
    y cada versión tiene su propio schema; cualquier otro entero recibe
    `422 UNSUPPORTED_VERSION`.

    Módulo **separado** de la ingesta de GeoCampo (`/api/qa-externa/*`): tablas
    propias, API keys propias y CLI de alta propio. Lo único que comparten es el
    portal de revisión y la cuenta del revisor.

    **Reglas duras del contrato:**

    - La respuesta de éxito es SIEMPRE `201` (alta) o `200` (reenvío idempotente),
      las dos con cuerpo `{"idRemoto":"…"}`. **Nunca `204`**: la app necesita el
      `idRemoto` para cerrar el registro local.
    - La idempotencia la da `idLocal` (UNIQUE en base de datos) más un hash
      canónico SHA-256 del contenido sustantivo. El mismo `idLocal` con el mismo
      contenido devuelve el **mismo** `idRemoto`; con contenido distinto es `409`
      y la fila original **no** se toca.
    - Los campos de sincronización del teléfono (`estadoSincronizacion`,
      `numeroIntentosSincronizacion`, `fechaUltimoIntento`, `fechaSincronizacion`)
      y un `idRemoto` enviado por el cliente se **descartan**: ni se validan, ni
      entran al hash, ni ocupan columna. Mandarlos es inofensivo.
    - El cuerpo va en `application/json` y tiene un tope de **256 KB**.

    **Audios (`POST /api/v1/encuestas/{idLocal}/audios`):** la app sube los
    segmentos grabados **después** de que la encuesta fue aceptada, uno por
    petición y en `multipart/form-data`. Tres reglas divergen a propósito del
    resto del API y no se "arreglan": el `404` de encuesta desconocida va con
    envolvente **anidada** (`{"error":{"code":"ENCUESTA_NO_ENCONTRADA"}}`), el
    exceso de tamaño es **`413`** (y no el `400` con que el repo mapea multer), y
    **cualquier otra validación es `422`, nunca `400`** (el cliente trata el 400
    como transitorio y reintentaría el archivo para siempre).
  contact:
    name: Equipo backend flotillas
  license:
    name: Uso interno

servers:
  - url: https://qa.aztechcomposites.com
    description: |
      Despliegue público de QA. TLS de Let's Encrypt (CA pública): la app no
      necesita CA custom ni `network-security-config`.

security:
  - apiKeyDispositivo: []

tags:
  - name: ingesta
    description: Envío de encuestas desde el dispositivo.
  - name: diagnóstico
    description: Prueba de conectividad y de credencial.

paths:
  /api/v1/encuestas:
    post:
      tags: [ingesta]
      # El nombre conserva el sufijo V3 del spec 3.0.0 aunque hoy también ingesta
      # v1: renombrarlo rompería cualquier cliente ya generado de ese spec.
      operationId: ingestarEncuestaV3
      summary: Envía una encuesta.
      description: |
        Alta idempotente de una encuesta. El servidor mira `versionCuestionario`,
        valida el payload contra el cuestionario **de esa versión** (v1 o v3),
        calcula el hash canónico de esa misma versión e inserta una sola fila.

        Reintentar tras un timeout es seguro: si la fila ya existía con el mismo
        contenido, la respuesta es `200` con el mismo `idRemoto`.

        El prefijo `/api` **no es opcional**: en el despliegue público Caddy manda
        todo el tráfico a Next, y Next solo reescribe hacia la API las rutas que
        empiezan por `/api`. Sin el prefijo, la petición acaba en una redirección
        al login del portal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Las tres versiones del cuestionario, seleccionadas por el `const`
              # de `versionCuestionario` (1, 3 o 4) que lleva cada rama. NO se usa
              # `discriminator`: el keyword exige una propiedad de tipo string y
              # aquí el discriminante es un entero.
              oneOf:
                - $ref: '#/components/schemas/EncuestaV1'
                - $ref: '#/components/schemas/EncuestaV3'
                - $ref: '#/components/schemas/EncuestaV4'
            examples:
              encuestaV3:
                summary: Encuesta completada (v3)
                value:
                  idLocal: '7f9c2a10-4d3b-4a7e-9f21-0c8b5d6e1a44'
                  folioLocal: 'LX-001248'
                  encuestador: 'María López'
                  versionCuestionario: 3
                  estado: completada
                  fechaHoraInicio: '2026-07-30T16:12:04.000Z'
                  fechaHoraFinalizacion: '2026-07-30T16:18:41.000Z'
                  duracionSegundos: 397
                  respuestas:
                    sexo: mujer
                    rangoEdad: '31_45'
                    empresariosConocidos: ['Javier González', 'Rosa Mendoza']
                    politicosConocidos: ['Lalo Ximénez', 'Irineo Molina', 'Fernando Huerta']
                    conoceLalo: 'si'
                    rolLalo: politico_lider_social
                    opinionLalo: buena
                    preferenciaElectoral: lalo_ximenez
                    preferenciaPartido: morena
                    aprobacionPorGobernante:
                      - { gobernante: sheinbaum, calificacion: muy_buena }
                      - { gobernante: jara, calificacion: buena }
                      - { gobernante: huerta, calificacion: buena }
                  ubicacion:
                    disponible: true
                    latitud: 19.432608
                    longitud: -99.133209
                    precisionMetros: 12.4
                    fechaHoraCaptura: '2026-07-30T16:18:39.000Z'
                    permiso: concedido
                    servicioActivo: true
                    esValida: true
                  dispositivo:
                    plataforma: android
                    modelo: 'Moto G54'
                    versionSistema: '14'
                  versionAplicacion: '2.0.0'
              encuestaV4:
                summary: Encuesta completada (v4 con "otro")
                value:
                  idLocal: 'a1b2c3d4-e5f6-47a8-9b0c-1d2e3f4a5b6c'
                  folioLocal: 'LX-001250'
                  encuestador: 'Roberto García'
                  versionCuestionario: 4
                  estado: completada
                  fechaHoraInicio: '2026-07-31T09:30:00.000Z'
                  fechaHoraFinalizacion: '2026-07-31T09:35:20.000Z'
                  duracionSegundos: 320
                  respuestas:
                    sexo: hombre
                    rangoEdad: '18_30'
                    empresariosConocidos: ['Juan Pérez']
                    politicosConocidos: ['Otro político local']
                    conoceLalo: 'si'
                    rolLalo: 'politico_lider_social'
                    opinionLalo: 'regular'
                    preferenciaElectoral: otro
                    preferenciaElectoralOtro: 'Candidato independiente'
                    preferenciaPartido: otro
                    preferenciaPartidoOtro: 'Movimiento local'
                    aprobacionPorGobernante:
                      - { gobernante: sheinbaum, calificacion: regular }
                      - { gobernante: jara, calificacion: mala }
                      - { gobernante: huerta, calificacion: buena }
                  ubicacion:
                    disponible: true
                    latitud: 19.5432
                    longitud: -99.1456
                    precisionMetros: 25.0
                    fechaHoraCaptura: '2026-07-31T09:35:15.000Z'
                    permiso: concedido
                    servicioActivo: true
                    esValida: true
                  dispositivo:
                    plataforma: android
                    modelo: 'Samsung A12'
                    versionSistema: '11'
                  versionAplicacion: '2.1.0'
              encuestaV1:
                summary: Encuesta completada, elegible (v1)
                value:
                  idLocal: '3f2504e0-4f89-41d3-9a0c-0305e82c3301'
                  folioLocal: 'LX-1042'
                  encuestador: 'María López'
                  versionCuestionario: 1
                  estado: completada
                  elegibilidad: elegible
                  fechaHoraInicio: '2026-07-30T10:00:00.000Z'
                  fechaHoraFinalizacion: '2026-07-30T10:06:40.000Z'
                  duracionSegundos: 400
                  respuestas:
                    credencialVigente: 'si'
                    rangoEdad: '30_44'
                    genero: mujer
                    partidoPreferido: morena
                    conocimientoPorPersona:
                      - { persona: lalo_ximenez, nivel: bien }
                      - { persona: laura_estrada, nivel: algo }
                      - { persona: paco_nino, nivel: poco }
                      - { persona: gabriela_delgado, nivel: no_conoce }
                      - { persona: irineo_molina, nivel: no_conoce }
                      - { persona: goyo_castaneda, nivel: no_conoce }
                      - { persona: ernesto_montero, nivel: no_conoce }
                    mediosConocimiento:
                      tipo: respondida
                      medios: [redes_sociales, labor_social]
                    mayorPersonalidad: lalo_ximenez
                    candidatoPreferido: laura_estrada
                  ubicacion:
                    disponible: true
                    latitud: 19.432608
                    longitud: -99.133209
                    precisionMetros: 12.5
                    fechaHoraCaptura: '2026-07-30T10:05:00.000Z'
                    permiso: concedido
                    servicioActivo: true
                    esValida: true
                  dispositivo:
                    plataforma: android
                    modelo: 'Moto G54'
                    versionSistema: '14'
                  versionAplicacion: '1.0.3'
      responses:
        '201':
          description: Encuesta creada. Es la respuesta normal del primer envío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestaAceptada'
              example:
                idRemoto: 'c1a7e0b2-9d44-4f0a-b7c3-2e5f8a91d033'
        '200':
          description: |
            Reenvío idempotente: el `idLocal` ya existía con el **mismo** contenido
            sustantivo. Devuelve el mismo `idRemoto` de la primera vez y no crea
            otra fila. La app debe tratarlo exactamente igual que el `201`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestaAceptada'
              example:
                idRemoto: 'c1a7e0b2-9d44-4f0a-b7c3-2e5f8a91d033'
        '400':
          description: |
            Cuerpo que no es JSON válido (`BAD_JSON`) o que no es un objeto.
            No reintentable sin corregir el payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'Cuerpo JSON malformado'
                code: BAD_JSON
                requestId: '0f0c1a7e-…'
        '401':
          description: |
            Falta el header `Authorization`, el formato no es `Bearer <key>`, la
            key no existe o el dispositivo fue revocado (`activo = false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'API key inválida o revocada'
                code: UNAUTHORIZED
        '403':
          description: |
            Sin permisos. La ingesta por API key **no** emite este código: recibirlo
            significa que la petición no llegó a este router — típicamente una URL
            base mal configurada que cayó en un montaje protegido por JWT. Corregir
            la URL, no reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: |
            El `idLocal` ya está registrado **con contenido sustantivo distinto**.
            La fila original queda intacta. No sirve reintentar con la misma clave:
            es un `idLocal` reutilizado en el teléfono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'idLocal ya registrado con contenido distinto'
                code: CONFLICT
                requestId: '0f0c1a7e-…'
        '413':
          description: |
            El cuerpo supera los 256 KB. El límite se aplica sobre el stream, así
            que también corta las peticiones `chunked` sin `Content-Length`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'Cuerpo de la petición demasiado grande'
                code: PAYLOAD_TOO_LARGE
                requestId: '0f0c1a7e-…'
        '422':
          description: |
            El JSON es válido pero el contenido no pasa el cuestionario de su
            versión (`VALIDATION_ERROR`), o `versionCuestionario` es un entero
            fuera de {1, 3, 4} (`UNSUPPORTED_VERSION`). **Terminal**: reintentar el
            mismo payload volverá a fallar.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorValidacion'
                  - $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                validacionV3:
                  summary: Fallo del schema v3
                  value:
                    error: 'Datos inválidos'
                    code: VALIDATION_ERROR
                    issues:
                      - field: respuestas.aprobacionPorGobernante
                        message: 'aprobacionPorGobernante debe traer los 3 gobernantes del catálogo v3'
                      - field: ubicacion.esValida
                        message: 'esValida debe ser true exactamente cuando precisionMetros <= 50'
                    requestId: '0f0c1a7e-…'
                validacionV1:
                  summary: Fallo del schema v1
                  value:
                    error: 'Datos inválidos'
                    code: VALIDATION_ERROR
                    issues:
                      - field: respuestas.conocimientoPorPersona
                        message: 'conocimientoPorPersona debe traer las 7 personas del catálogo v1'
                      - field: respuestas.mediosConocimiento.tipo
                        message: 'mediosConocimiento debe venir respondida si conoce al menos a una persona'
                    requestId: '0f0c1a7e-…'
                versionNoSoportada:
                  summary: Cuestionario de una versión que este servidor no habla (p. ej. v2, v5)
                  value:
                    error: 'Versión de cuestionario no soportada'
                    code: UNSUPPORTED_VERSION
                    requestId: '0f0c1a7e-…'
        '429':
          description: |
            Se agotó una de las dos cuotas: la del dispositivo o la de la IP. La
            cabecera `Retry-After` trae los segundos que faltan para la siguiente
            ventana. Reintentable con backoff.
          headers:
            Retry-After:
              description: Segundos hasta que la ventana se reabre.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'Demasiadas encuestas desde este dispositivo. Intenta más tarde.'
                code: RATE_LIMITED
        '500':
          description: |
            Error interno. **No** hubo escritura parcial: el alta es un solo INSERT
            atómico. Reintentable con el mismo `idLocal`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'Error interno del servidor'
                code: INTERNAL_ERROR
                requestId: '0f0c1a7e-…'

    get:
      tags: [diagnóstico]
      operationId: encuestasMetodoNoPermitido
      summary: No permitido — responde 405 con credencial válida.
      description: |
        Existe a propósito, como red de seguridad para una app que se equivoque de
        método: sin él la petición saldría de este router y la atraparían los
        montajes comodín con JWT, que responden **401** — y el móvil lee ese 401
        como "API key inválida" y dispara una reconfiguración innecesaria. Un 405
        dice lo que de verdad pasa: la key sirve, el método no.

        Para probar conectividad, usa `/api/v1/encuestas/ping`.
      responses:
        '405':
          description: Método no permitido (la API key sí es válida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'Method Not Allowed'
                code: METHOD_NOT_ALLOWED
        '401':
          description: Sin credencial válida (el guard corre antes que el 405).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/encuestas/{idLocal}/audios:
    parameters:
      - name: idLocal
        in: path
        required: true
        description: |
          El **mismo UUID** que la encuesta llevaba en su JSON (`idLocal`), no el
          `idRemoto` que devolvió el servidor. Se resuelve DENTRO del dispositivo
          autenticado: una encuesta de otro teléfono es, para esta ruta,
          inexistente.
        schema:
          type: string
          format: uuid

    post:
      tags: [ingesta]
      operationId: subirAudioEncuesta
      summary: Sube un segmento de audio de una encuesta ya sincronizada.
      description: |
        La app graba la entrevista en segmentos (`seg1.m4a`, `seg2.m4a`, …), uno
        por pausa/reanudación, y los sube **uno por petición** cuando la encuesta
        ya está en el servidor. Los segmentos son **inmutables**: nunca se regraba
        uno ya cerrado, siempre nace `segN+1`.

        **Idempotente por `(encuesta, segmento, sha256)`:** un reenvío idéntico
        devuelve `200` con el **mismo** `audio_id` y no reescribe el archivo. El
        mismo `(encuesta, segmento)` con otro contenido reemplaza el archivo y
        devuelve también `200` con el mismo `audio_id`. **Esta ruta no emite
        `409`.**

        El servidor **recalcula** el SHA-256 de lo recibido y lo contrasta con
        `sha256` y `tamano_bytes`: si no cuadran, la subida iba truncada y la
        respuesta es `422` (reencolar el archivo y reintentar). Nunca hay `2xx`
        antes de que el archivo esté persistido en disco.

        Consume el **mismo** cubo de rate-limit por dispositivo que
        `POST /api/v1/encuestas` (60 por ventana).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              # Sin `additionalProperties: false` a propósito: el servidor IGNORA
              # las partes de TEXTO que no espera (solo una parte de ARCHIVO con
              # otro nombre da 422), así que un cliente generado con ese candado
              # rechazaría un formulario que el servidor acepta sin problema.
              required: [segmento, sha256, tamano_bytes, audio]
              properties:
                segmento:
                  type: string
                  pattern: '^[A-Za-z0-9._-]{1,64}$'
                  description: |
                    Nombre lógico del tramo tal como lo llama el teléfono
                    (`seg1.m4a`). Es la clave del segmento dentro de la encuesta.
                  examples:
                    - seg1.m4a
                sha256:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                  description: SHA-256 del contenido, hexadecimal de 64 caracteres en **minúsculas**.
                tamano_bytes:
                  type: string
                  pattern: '^[1-9][0-9]{0,9}$'
                  description: |
                    Tamaño del archivo en bytes. Viaja como **texto**: en multipart
                    todo es texto (a diferencia de la ingesta JSON, donde los
                    números son números).

                    Entero **≤ 2147483647**: la columna `tamano_bytes` es INT4 en
                    Postgres. El tope real lo impone antes
                    `ENCUESTAS_AUDIO_MAX_FILE_SIZE_MB` (máximo admitido 100 MB),
                    así que un valor legítimo nunca se acerca al límite.
                  examples:
                    - '1048576'
                audio:
                  type: string
                  format: binary
                  description: |
                    El archivo. Se guarda **tal cual**: el servidor no
                    transcodifica ni valida el formato (archivos antiguos pueden
                    ser 3GP/AMR con extensión `.m4a`).
            encoding:
              audio:
                contentType: audio/mp4, audio/3gpp, application/octet-stream
      responses:
        '201':
          description: Segmento nuevo, ya escrito en disco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioRespuesta'
              example:
                audio_id: '12'
        '200':
          description: |
            El segmento ya existía: reenvío idempotente. Trae el **mismo**
            `audio_id` que el `201` original.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioRespuesta'
              example:
                audio_id: '12'
        '401':
          description: Sin `Authorization`, key desconocida o dispositivo revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'API key inválida o revocada'
                code: UNAUTHORIZED
        '404':
          description: |
            El `idLocal` no existe **para este dispositivo** — típicamente porque
            la encuesta todavía no se sincronizó. Reintentable: primero la
            encuesta, después sus audios.

            **Divergencia deliberada:** es la única respuesta del API con
            envolvente **anidada**, sin `message` ni `requestId`. El cliente móvil
            ya está escrito contra esa forma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaNoEncontrada'
              example:
                error:
                  code: ENCUESTA_NO_ENCONTRADA
        '413':
          description: |
            El archivo supera `ENCUESTAS_AUDIO_MAX_FILE_SIZE_MB` (**50 MB** por
            defecto). Rechazo definitivo del segmento: no sirve reintentarlo sin
            recortarlo.

            **Divergencia deliberada:** el resto del repo mapea el límite de
            multer a `400`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'El audio supera el máximo de 50 MB'
                code: PAYLOAD_TOO_LARGE
                requestId: '0f0c1a7e-…'
        '422':
          description: |
            Falta una parte, un campo no valida, o el `sha256`/`tamano_bytes` no
            coinciden con lo recibido. **Toda** la validación de esta ruta sale
            así: **nunca `400`**.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              examples:
                integridad:
                  summary: La subida llegó truncada (reencolar el archivo)
                  value:
                    error: 'Datos inválidos'
                    code: VALIDATION_ERROR
                    issues:
                      - field: sha256
                        message: 'El SHA-256 del contenido recibido no coincide con el declarado'
                    requestId: '0f0c1a7e-…'
                parteFaltante:
                  summary: El multipart no traía el archivo
                  value:
                    error: 'Datos inválidos'
                    code: VALIDATION_ERROR
                    issues:
                      - field: audio
                        message: 'Falta la parte "audio" con el archivo'
                    requestId: '0f0c1a7e-…'
        '429':
          description: |
            Cuota agotada. El cubo por dispositivo es el **mismo** que el de
            `POST /api/v1/encuestas`. Reintentable con backoff.
          headers:
            Retry-After:
              description: Segundos hasta que la ventana se reabre.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'Demasiados envíos desde este dispositivo. Intenta más tarde.'
                code: RATE_LIMITED

    get:
      tags: [diagnóstico]
      operationId: audiosMetodoNoPermitido
      summary: No permitido — responde 405 con credencial válida.
      description: |
        Misma red de seguridad que el `405` de `GET /api/v1/encuestas`: sin él la
        petición saldría de este router y la atraparían los montajes comodín con
        JWT, que responden **401**, y el móvil lo leería como "API key inválida".
      responses:
        '405':
          description: Método no permitido (la API key sí es válida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: 'Method Not Allowed'
                code: METHOD_NOT_ALLOWED
        '401':
          description: Sin credencial válida (el guard corre antes que el 405).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/v1/encuestas/ping:
    get:
      tags: [diagnóstico]
      operationId: encuestasPing
      summary: Prueba de conectividad y de la API key.
      description: |
        Verifica de una sola vez que hay red, que la URL base es correcta y que la
        API key del dispositivo está activa. No toca la base de datos ni consume
        cuota de captura (sí la del cubo por IP).
      responses:
        '200':
          description: Conexión y credencial correctas.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true
        '401':
          description: Sin `Authorization`, key desconocida o dispositivo revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '429':
          description: Cuota por IP agotada.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

components:
  securitySchemes:
    apiKeyDispositivo:
      type: http
      scheme: bearer
      description: |
        API key del dispositivo, emitida por el CLI de alta y mostrada **una sola
        vez** (el servidor guarda solo su hash SHA-256). Va en el header
        `Authorization: Bearer <api key>`. No es un JWT: no expira y no tiene
        claims; se revoca dando de baja el dispositivo.

  schemas:
    # ── Catálogos v3 ────────────────────────────────────────────────────────
    # Van como TEXT validado en la aplicación (no como enums de PostgreSQL) para
    # poder publicar un cuestionario v4 sin ALTER TYPE.

    SexoV3:
      type: string
      description: Sexo declarado.
      enum: [hombre, mujer]

    RangoEdadV3:
      type: string
      description: Rango de edad declarado.
      enum: ['18_30', '31_45', '46_mas']

    RolLaloV3:
      type: string
      description: Rol de Lalo Ximénez declarado.
      enum: [politico_lider_social, empresario, funcionario_publico, no_sabe_no_contesta]

    OpinionLaloV3:
      type: string
      description: Opinión sobre Lalo Ximénez declarada.
      enum: [muy_buena, buena, regular, mala, muy_mala, no_lo_conozco]

    PreferenciaElectoralV3:
      type: string
      description: Preferencia electoral declarada.
      enum: [lalo_ximenez, irineo_molina, fernando_huerta, paola_barrera, ana_gabriela_delgado]

    PartidoV3:
      type: string
      description: Preferencia partidista declarada.
      enum: [pri, morena, pan, panal_oaxaca, pt, prd_oaxaca, pvem, pto, mc]

    PreferenciaElectoralV4:
      type: string
      description: |
        Preferencia electoral declarada (v4). NO es un superconjunto de v3: `paola_barrera` se retiró, y se añadieron `paco_nino` y `goyo_castaneda`.
      enum:
        - irineo_molina
        - fernando_huerta
        - lalo_ximenez
        - paco_nino
        - ana_gabriela_delgado
        - goyo_castaneda
        - otro
        - no_sabe_no_contesta

    PartidoV4:
      type: string
      description: |
        Preferencia partidista declarada (v4). Extiende la v3 con opciones de texto libre.
      enum:
        - pri
        - morena
        - pan
        - panal_oaxaca
        - pt
        - prd_oaxaca
        - pvem
        - pto
        - mc
        - otro
        - no_sabe_no_contesta

    GobernantesV3:
      type: string
      description: Gobernante del catálogo para aprobación.
      enum: [sheinbaum, jara, huerta]

    CalificacionV3:
      type: string
      description: Calificación de gobernante.
      enum: [muy_buena, buena, regular, mala, muy_mala]

    # ── Catálogos v1 (cuestionario restaurado) ──────────────────────────────
    # Mismo criterio que los de la v3 (TEXT validado en la app) y **disjuntos**
    # de aquéllos salvo por coincidencias inocuas (`morena`, `hombre`):
    # `versionCuestionario` desambigua la fila.

    PersonaV1:
      type: string
      description: Personalidad del catálogo v1. Son exactamente 7 y no cambian dentro de la versión 1.
      enum:
        - lalo_ximenez
        - laura_estrada
        - paco_nino
        - gabriela_delgado
        - irineo_molina
        - goyo_castaneda
        - ernesto_montero

    NivelConocimientoV1:
      type: string
      description: Nivel de conocimiento declarado sobre una personalidad (P5).
      enum: [no_conoce, poco, algo, bien]

    MedioV1:
      type: string
      description: Vía por la que el encuestado conoce a las personalidades (P6).
      enum: [redes_sociales, otras_personas, labor_social]

    PartidoV1:
      type: string
      description: Preferencia partidista declarada (P4).
      enum:
        - morena
        - pri
        - ninguno_no_sabe
        - prd
        - mc
        - pvem
        - pt
        - independiente
        - panal
        - pan

    RangoEdadV1:
      type: string
      description: Rango de edad declarado (P2).
      enum: ['18_29', '30_44', '45_59', '60_mas']

    GeneroV1:
      type: string
      description: Género declarado (P3).
      enum: [hombre, mujer, otro]

    # ── Bloques del cuestionario v1 ─────────────────────────────────────────

    ConocimientoPersonaV1:
      type: object
      additionalProperties: false
      required: [persona, nivel]
      properties:
        persona:
          $ref: '#/components/schemas/PersonaV1'
        nivel:
          $ref: '#/components/schemas/NivelConocimientoV1'

    MediosConocimientoV1:
      description: |
        P6, unión discriminada por `tipo`. Cuando P5 dejó al encuestado sin
        ninguna personalidad conocida, la app **no** pregunta P6 y manda
        `omitidaPorLogica`; en cualquier otro caso manda `respondida` con al menos
        un medio. `respondida` con la lista vacía es 422; en cambio
        `omitidaPorLogica` con `medios` no lo es: el servidor estripa `medios` y
        acepta con 201.
      oneOf:
        - $ref: '#/components/schemas/MediosConocimientoOmitidaV1'
        - $ref: '#/components/schemas/MediosConocimientoRespondidaV1'
      discriminator:
        propertyName: tipo
        mapping:
          omitidaPorLogica: '#/components/schemas/MediosConocimientoOmitidaV1'
          respondida: '#/components/schemas/MediosConocimientoRespondidaV1'

    MediosConocimientoOmitidaV1:
      title: Omitida por lógica del cuestionario
      type: object
      # Sin `additionalProperties: false` a propósito: el servidor ESTRIPA lo que
      # sobra (p. ej. un `medios` residual) y acepta con 201, así que un cliente
      # generado con ese candado rechazaría un payload legítimo del teléfono.
      required: [tipo]
      properties:
        tipo:
          type: string
          const: omitidaPorLogica

    MediosConocimientoRespondidaV1:
      title: Respondida
      type: object
      additionalProperties: false
      required: [tipo, medios]
      properties:
        tipo:
          type: string
          const: respondida
        medios:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MedioV1'

    # ── Bloques del cuestionario v3 ─────────────────────────────────────────

    AprobacionPorGobernanteV3:
      type: object
      additionalProperties: false
      required: [gobernante, calificacion]
      properties:
        gobernante:
          $ref: '#/components/schemas/GobernantesV3'
        calificacion:
          $ref: '#/components/schemas/CalificacionV3'

    # ── Bloques compartidos por las tres versiones ───────────────────────────
    # El cuestionario cambia, pero la ubicación y los metadatos del teléfono son
    # los mismos en v1, v3 y v4. Conservan los nombres publicados en el spec
    # 3.0.0 (el sufijo `V1` viene de la ruta `/api/v1/`, no del cuestionario):
    # renombrarlos rompería cualquier cliente ya generado de ese spec.

    UbicacionV1:
      description: |
        Bloque de ubicación, unión discriminada por `disponible`.

        **Omitir el bloque entero es válido** (registro antiguo o app previa a la
        captura de GPS) y se persiste como `NULL`, que es distinto de
        `disponible: false`. Lo que **no** se acepta es `"ubicacion": null`.
      oneOf:
        - $ref: '#/components/schemas/UbicacionDisponibleV1'
        - $ref: '#/components/schemas/UbicacionNoDisponibleV1'

    UbicacionDisponibleV1:
      title: Ubicación capturada
      type: object
      additionalProperties: false
      required:
        - disponible
        - latitud
        - longitud
        - precisionMetros
        - fechaHoraCaptura
        - permiso
        - servicioActivo
        - esValida
      properties:
        disponible:
          type: boolean
          const: true
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        precisionMetros:
          type: number
          minimum: 0
          description: |
            Radio de incertidumbre en metros. Debe ser un número finito: `Infinity`
            o `NaN` (que JSON no puede expresar, pero sí un cliente que serialice
            mal) se rechazan.
        fechaHoraCaptura:
          type: string
          format: date-time
          description: Instante de la lectura del GPS, en ISO-8601 con sufijo `Z`.
        esValida:
          type: boolean
          description: |
            **Redundante a propósito y verificado por el servidor**: debe ser
            exactamente `precisionMetros <= 50`. Si el teléfono manda un valor que
            no concuerda, la encuesta se rechaza con 422 — es la señal de que el
            cálculo del cliente y el del servidor divergieron.
        permiso:
          type: string
          const: concedido
          description: Si hay coordenadas, el permiso solo puede haber sido concedido.
        servicioActivo:
          type: boolean
          const: true
          description: Si hay coordenadas, el servicio de ubicación estaba encendido.

    UbicacionNoDisponibleV1:
      title: Ubicación no capturada
      type: object
      additionalProperties: false
      required: [disponible, permiso, servicioActivo, motivoNoDisponible]
      properties:
        disponible:
          type: boolean
          const: false
        permiso:
          type: string
          description: |
            Estado del permiso de ubicación en el momento de la encuesta. Debe ser
            coherente con `motivoNoDisponible`: con `permisoDenegado` **no** puede
            valer `concedido`.
          enum: [concedido, denegado, noSolicitado]
        servicioActivo:
          type: boolean
          description: |
            Si el servicio de ubicación del sistema estaba encendido. Con
            `motivoNoDisponible: servicioDesactivado` debe ser `false`.
        motivoNoDisponible:
          type: string
          description: |
            Por qué no hay coordenadas. Coherencia exigida por el servidor:
            `permisoDenegado` ⇒ `permiso ≠ concedido`; `servicioDesactivado` ⇒
            `servicioActivo = false`; con permiso concedido **y** servicio activo,
            el motivo solo puede ser `errorTemporal` u `omitidaPorEncuestador`.
          enum:
            - permisoDenegado
            - servicioDesactivado
            - errorTemporal
            - omitidaPorEncuestador

    DispositivoMetaV1:
      type: object
      additionalProperties: false
      required: [plataforma, modelo, versionSistema]
      description: |
        Metadatos del teléfono que levantó la encuesta. **Entran al hash
        canónico**: si la app los estampa al *enviar* en vez de al *capturar*, un
        reintento después de actualizar la app produciría un 409.
      properties:
        plataforma:
          type: string
          minLength: 1
          maxLength: 120
          examples: [android, ios]
        modelo:
          type: string
          minLength: 1
          maxLength: 120
          examples: ['Moto G54']
        versionSistema:
          type: string
          minLength: 1
          maxLength: 120
          examples: ['14']

    # ── Bloque `respuestas` ─────────────────────────────────────────────────
    # Las respuestas del cuestionario NO van en la raíz: viven agrupadas bajo la
    # clave `respuestas`, cuya forma depende de la versión (y, en v1, de la rama).
    # Todos los campos son obligatorios dentro de su forma.

    RespuestasV3:
      type: object
      additionalProperties: false
      required:
        - sexo
        - rangoEdad
        - empresariosConocidos
        - politicosConocidos
        - conoceLalo
        - rolLalo
        - opinionLalo
        - preferenciaElectoral
        - preferenciaPartido
        - aprobacionPorGobernante
      properties:
        sexo:
          $ref: '#/components/schemas/SexoV3'
        rangoEdad:
          $ref: '#/components/schemas/RangoEdadV3'
        empresariosConocidos:
          type: array
          minItems: 0
          maxItems: 3
          description: |
            Nombres de empresarios conocidos. Texto libre, 1–80 caracteres cada uno.
            Se recorta el espacio sobrante (trim).
          items:
            type: string
            minLength: 1
            maxLength: 80
        politicosConocidos:
          type: array
          minItems: 1
          maxItems: 3
          description: |
            Nombres de políticos conocidos. Texto libre, 1–80 caracteres cada uno.
            Debe traer al menos uno.
          items:
            type: string
            minLength: 1
            maxLength: 80
        conoceLalo:
          type: string
          # Entrecomillados: en YAML 1.1 un `no` a secas se lee como booleano false.
          enum: ['si', 'no']
          description: ¿Conoce a Lalo Ximénez?
        rolLalo:
          $ref: '#/components/schemas/RolLaloV3'
        opinionLalo:
          $ref: '#/components/schemas/OpinionLaloV3'
        preferenciaElectoral:
          $ref: '#/components/schemas/PreferenciaElectoralV3'
        preferenciaPartido:
          $ref: '#/components/schemas/PartidoV3'
        aprobacionPorGobernante:
          type: array
          minItems: 3
          maxItems: 3
          description: |
            Exactamente 3 filas, una por gobernante (sheinbaum, jara, huerta),
            sin repetir. El orden en el payload será normalizado al orden canónico
            antes de hashear.
          items:
            $ref: '#/components/schemas/AprobacionPorGobernanteV3'

    RespuestasV4:
      type: object
      additionalProperties: false
      required:
        - sexo
        - rangoEdad
        - empresariosConocidos
        - politicosConocidos
        - conoceLalo
        - rolLalo
        - opinionLalo
        - preferenciaElectoral
        - preferenciaPartido
        - aprobacionPorGobernante
      description: |
        Respuestas de v4 (igual a v3 excepto por los nuevos catálogos y campos opcionales).
        Los campos `preferenciaElectoralOtro` y `preferenciaPartidoOtro` son opcionales,
        pero con regla condicional: si `preferenciaElectoral` o `preferenciaPartido`
        (según corresponda) es `"otro"`, el campo de texto es **obligatorio** (1–80 chars
        tras trim); si es cualquier otro valor, el campo presente se **rechaza**; en
        `no_sabe_no_contesta` se omite.
      properties:
        sexo:
          $ref: '#/components/schemas/SexoV3'
        rangoEdad:
          $ref: '#/components/schemas/RangoEdadV3'
        empresariosConocidos:
          type: array
          minItems: 0
          maxItems: 3
          description: |
            Nombres de empresarios conocidos. Texto libre, 1–80 caracteres cada uno.
            Se recorta el espacio sobrante (trim).
          items:
            type: string
            minLength: 1
            maxLength: 80
        politicosConocidos:
          type: array
          minItems: 1
          maxItems: 3
          description: |
            Nombres de políticos conocidos. Texto libre, 1–80 caracteres cada uno.
            Debe traer al menos uno.
          items:
            type: string
            minLength: 1
            maxLength: 80
        conoceLalo:
          type: string
          enum: ['si', 'no']
          description: ¿Conoce a Lalo Ximénez?
        rolLalo:
          $ref: '#/components/schemas/RolLaloV3'
        opinionLalo:
          $ref: '#/components/schemas/OpinionLaloV3'
        preferenciaElectoral:
          $ref: '#/components/schemas/PreferenciaElectoralV4'
        preferenciaElectoralOtro:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Campo opcional (v4): especificación en texto libre cuando
            `preferenciaElectoral` es `"otro"`.
        preferenciaPartido:
          $ref: '#/components/schemas/PartidoV4'
        preferenciaPartidoOtro:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Campo opcional (v4): especificación en texto libre cuando
            `preferenciaPartido` es `"otro"`.
        aprobacionPorGobernante:
          type: array
          minItems: 3
          maxItems: 3
          description: |
            Exactamente 3 filas, una por gobernante (sheinbaum, jara, huerta),
            sin repetir. El orden en el payload será normalizado al orden canónico
            antes de hashear.
          items:
            $ref: '#/components/schemas/AprobacionPorGobernanteV3'

    RespuestasCompletadaV1:
      type: object
      additionalProperties: false
      required:
        - credencialVigente
        - rangoEdad
        - genero
        - partidoPreferido
        - conocimientoPorPersona
        - mediosConocimiento
        - mayorPersonalidad
        - candidatoPreferido
      properties:
        credencialVigente:
          type: string
          const: 'si'
          description: P1. En esta rama solo puede valer `si`.
        rangoEdad:
          $ref: '#/components/schemas/RangoEdadV1'
        genero:
          $ref: '#/components/schemas/GeneroV1'
        partidoPreferido:
          $ref: '#/components/schemas/PartidoV1'
        conocimientoPorPersona:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          description: |
            P5. Deben venir **las 7 personas del catálogo, exactamente una vez
            cada una**. El orden del array no es sustantivo: el servidor lo
            reordena al orden canónico antes de hashear, así que reenviarlo
            barajado sigue siendo el mismo registro.
          items:
            $ref: '#/components/schemas/ConocimientoPersonaV1'
        mediosConocimiento:
          $ref: '#/components/schemas/MediosConocimientoV1'
        mayorPersonalidad:
          allOf:
            - $ref: '#/components/schemas/PersonaV1'
          description: P7 — a quién identifica como la mayor personalidad.
        candidatoPreferido:
          allOf:
            - $ref: '#/components/schemas/PersonaV1'
          description: P8 — a quién preferiría como candidato.

    RespuestasNoElegibleV1:
      type: object
      # Sin `additionalProperties: false` a propósito: el servidor ESTRIPA lo que
      # sobra y acepta con 201, así que un cliente generado con ese candado
      # rechazaría un payload legítimo del teléfono.
      required: [credencialVigente, conocimientoPorPersona]
      description: |
        Solo P1. Las demás respuestas **no se declaran**: si el teléfono manda el
        borrador previo al "no" de P1, el servidor lo descarta antes de hashear y
        esas columnas quedan en `NULL`.
      properties:
        credencialVigente:
          type: string
          const: 'no'
          description: P1. En esta rama solo puede valer `no`.
        conocimientoPorPersona:
          type: array
          maxItems: 0
          description: Debe venir vacío.
          items: {}

    # ── Payload de la encuesta ──────────────────────────────────────────────

    EncuestaBaseV3:
      type: object
      description: |
        Campos de la **raíz** que las tres versiones comparten. Cada versión añade
        encima su `versionCuestionario`, su `estado` y su bloque `respuestas` (y,
        en v1, la `elegibilidad`).

        El nombre conserva el sufijo V3 del spec 3.0.0 aunque la base sea común a
        las tres versiones: renombrarlo rompería los clientes ya generados.
      required:
        - idLocal
        - fechaHoraInicio
        - fechaHoraFinalizacion
        - duracionSegundos
        - dispositivo
        - versionAplicacion
      properties:
        idLocal:
          type: string
          format: uuid
          description: |
            UUID generado por el teléfono. **Es la clave de idempotencia** (UNIQUE
            global, no por dispositivo). Debe ser estable entre reintentos del
            mismo registro y nunca reutilizarse para otro.
        folioLocal:
          type: string
          pattern: '^LX-[0-9]+$'
          description: |
            Folio impreso en el papel del encuestador. Opcional y **no único**: dos
            teléfonos pueden emitir el mismo folio legítimamente.
          examples: ['LX-001248']
        encuestador:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Nombre de la persona que levanta la encuesta. Va en la **raíz** del
            payload, no dentro de `respuestas`.

            **Opcional por retrocompatibilidad**: las encuestas capturadas antes
            de que la app incorporara el campo se siguen aceptando sin él. Si no
            se conoce, **omite la clave**; `null` y `""` son 422 (el campo es
            opcional, no anulable — mismo criterio que `ubicacion`).

            **Entra al hash canónico**, así que debe capturarse junto con el
            registro y no estamparse al enviar: un valor distinto entre el primer
            envío y el reintento convertiría el 200 idempotente en un 409.
          examples: ['María López']
        fechaHoraInicio:
          type: string
          format: date-time
          description: ISO-8601 **con sufijo `Z`**. Sin designador de zona la interpretación depende del reloj del proceso.
        fechaHoraFinalizacion:
          type: string
          format: date-time
          description: ISO-8601 con sufijo `Z`. Debe ser mayor o igual que `fechaHoraInicio`.
        duracionSegundos:
          type: integer
          minimum: 0
          description: |
            Duración medida por la app. Se contrasta contra el intervalo
            `fechaHoraFinalizacion − fechaHoraInicio` con una tolerancia de
            **±60 s**; fuera de ella es 422.
        ubicacion:
          $ref: '#/components/schemas/UbicacionV1'
        dispositivo:
          $ref: '#/components/schemas/DispositivoMetaV1'
        versionAplicacion:
          type: string
          minLength: 1
          maxLength: 60
          description: Versión de la app móvil. Entra al hash canónico.
          examples: ['1.4.0']

    EncuestaV3:
      title: Encuesta v3 (cuestionario vigente)
      description: |
        Payload de una encuesta v3. Todos los campos de respuesta son obligatorios
        y no hay ramas: `estado` solo puede ser `completada`.
      allOf:
        - $ref: '#/components/schemas/EncuestaBaseV3'
        - type: object
          required: [versionCuestionario, estado, respuestas]
          properties:
            versionCuestionario:
              type: integer
              const: 3
              description: |
                Versión del cuestionario. Además del `3` se acepta el `1` (ver
                `EncuestaV1`) y el `4` (ver `EncuestaV4`); cualquier otro entero
                responde 422 `UNSUPPORTED_VERSION` (y un valor que no sea entero
                positivo, 422 `VALIDATION_ERROR`).
            estado:
              type: string
              const: completada
              description: Siempre `completada` en v3.
            respuestas:
              $ref: '#/components/schemas/RespuestasV3'

    EncuestaV4:
      title: Encuesta v4 (v3 extendida con opciones "otro")
      description: |
        Payload de una encuesta v4. Idéntico a v3 salvo por los nuevos catálogos de
        preferencias (que incluyen `"otro"` y `"no_sabe_no_contesta"`) y dos campos
        opcionales condicionales para especificar en texto libre. Todos los demás
        campos de respuesta son obligatorios y no hay ramas: `estado` solo puede
        ser `completada`.
      allOf:
        - $ref: '#/components/schemas/EncuestaBaseV3'
        - type: object
          required: [versionCuestionario, estado, respuestas]
          properties:
            versionCuestionario:
              type: integer
              const: 4
              description: |
                Versión del cuestionario. Además del `4` se acepta el `1` (ver
                `EncuestaV1`) y el `3` (ver `EncuestaV3`); cualquier otro entero
                responde 422 `UNSUPPORTED_VERSION`.
            estado:
              type: string
              const: completada
              description: Siempre `completada` en v4.
            respuestas:
              $ref: '#/components/schemas/RespuestasV4'

    EncuestaCompletadaV1:
      title: Encuesta v1 completada (elegible)
      description: |
        El encuestado tiene credencial vigente y respondió P2–P8. Todas las
        respuestas son obligatorias en esta rama.
      allOf:
        - $ref: '#/components/schemas/EncuestaBaseV3'
        - type: object
          required: [versionCuestionario, estado, elegibilidad, respuestas]
          properties:
            versionCuestionario:
              type: integer
              const: 1
            estado:
              type: string
              const: completada
            elegibilidad:
              type: string
              const: elegible
            respuestas:
              $ref: '#/components/schemas/RespuestasCompletadaV1'

    EncuestaNoElegibleV1:
      title: Encuesta v1 no elegible
      description: |
        El encuestado no tiene credencial vigente y la app corta el cuestionario en
        P1.
      allOf:
        - $ref: '#/components/schemas/EncuestaBaseV3'
        - type: object
          required: [versionCuestionario, estado, elegibilidad, respuestas]
          properties:
            versionCuestionario:
              type: integer
              const: 1
            estado:
              type: string
              const: noElegible
            elegibilidad:
              type: string
              const: noElegible
            respuestas:
              $ref: '#/components/schemas/RespuestasNoElegibleV1'

    EncuestaV1:
      title: Encuesta v1 (cuestionario restaurado)
      description: |
        Payload de una encuesta v1 (`versionCuestionario: 1`). Unión discriminada
        por `estado`: la rama `completada` exige P2–P8, la rama `noElegible` las
        prohíbe.

        Además del `1`, el servidor acepta el `3` (ver `EncuestaV3`); cualquier
        otro entero responde 422 `UNSUPPORTED_VERSION` (y un valor que no sea
        entero positivo, 422 `VALIDATION_ERROR`).
      oneOf:
        - $ref: '#/components/schemas/EncuestaCompletadaV1'
        - $ref: '#/components/schemas/EncuestaNoElegibleV1'
      discriminator:
        propertyName: estado
        mapping:
          completada: '#/components/schemas/EncuestaCompletadaV1'
          noElegible: '#/components/schemas/EncuestaNoElegibleV1'

    # ── Respuestas ──────────────────────────────────────────────────────────

    IngestaAceptada:
      type: object
      additionalProperties: false
      required: [idRemoto]
      description: |
        Único cuerpo de éxito, idéntico en 201 y en 200. La app solo necesita
        `idRemoto` para cerrar el registro local.
      properties:
        idRemoto:
          type: string
          format: uuid
          description: Identificador asignado por el servidor. Estable para un mismo `idLocal`.

    AudioRespuesta:
      type: object
      additionalProperties: false
      required: [audio_id]
      description: |
        Único cuerpo de éxito de la subida de audio, idéntico en 201 y en 200.
        Nunca hay un 2xx sin `audio_id`, ni antes de que el archivo esté en disco.
      properties:
        audio_id:
          type: string
          minLength: 1
          description: |
            Identificador del segmento en el servidor. **Cadena, no número**: para
            el cliente es opaco. Estable para un mismo `(encuesta, segmento)`,
            incluso si el contenido se reemplaza.
          examples:
            - '12'

    EncuestaNoEncontrada:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        Cuerpo EXACTO del `404` de la subida de audio. Es la **única** envolvente
        anidada del API (el resto es `{error, code, requestId}` plano) y va sin
        `message` ni `requestId`: divergencia deliberada, el cliente móvil ya está
        escrito contra esta forma.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              const: ENCUESTA_NO_ENCONTRADA

    ErrorRespuesta:
      type: object
      required: [error, code]
      description: Forma común de error de la API.
      properties:
        error:
          type: string
          description: Mensaje legible, seguro para mostrar o registrar.
        code:
          type: string
          description: Código estable para ramificar en el cliente.
          examples:
            - BAD_JSON
            - UNAUTHORIZED
            - FORBIDDEN
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - VALIDATION_ERROR
            - UNSUPPORTED_VERSION
            - METHOD_NOT_ALLOWED
            - RATE_LIMITED
            - INTERNAL_ERROR
        details:
          description: Detalle opcional del error (presente en algunos 400).
        requestId:
          type: string
          description: |
            Correlaciona la respuesta con la línea del log del servidor. Inclúyelo
            al reportar una incidencia.

    ErrorValidacion:
      type: object
      required: [error, code, issues]
      description: |
        Error 422 con el detalle campo a campo: el del cuestionario (v1, v3 o v4) y
        el de la subida de audio (partes del multipart e integridad del archivo).
      properties:
        error:
          type: string
          const: 'Datos inválidos'
        code:
          type: string
          const: VALIDATION_ERROR
        issues:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Ruta del campo, con puntos (`ubicacion.esValida`).
              message:
                type: string
        requestId:
          type: string
